# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# 리뷰와 채팅 응답 언어.
language: ko-KR

tone_instructions: >-
  클래스명·메서드명·패키지명·API 경로·라이브러리명·에러 메시지 같은 기술 식별자는
  번역하지 말고 원문을 유지한다. 번역투 대신 개발자가 실제로 쓰는 한국어로 쓴다.
  근거 없는 칭찬과 완곡한 표현은 넣지 않고, 문제는 어디가 왜 문제인지 짚는다.

reviews:
  # 아직 자동 리뷰를 켜지 않는다. 팀에서 규약을 맞춘 뒤 이 값만 true로 바꾼다.
  # 그 사이에 특정 PR만 보고 싶으면 PR 코멘트에 @coderabbitai review 를 남긴다.
  auto_review:
    enabled: false
