name: CD

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

# 배포는 중간에 끊으면 컨테이너가 내려간 채로 남을 수 있으므로 취소하지 않고 줄 세운다.
concurrency:
  group: cd-develop
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CONTAINER_NAME: puzzlemeet
  APP_PORT: 8080

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v6

      # bootJar만 돌리면 테스트가 빠진 채로 배포된다.
      # build는 테스트와 spotlessCheck까지 실행하므로 깨진 코드가 EC2로 넘어가지 않는다.
      - name: 빌드 및 테스트
        run: ./gradlew clean build

      - name: Buildx 설치
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 태그 결정
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=long

      # EC2가 x86_64가 아니라 Graviton(t4g 등)이면 linux/arm64로 바꾼다.
      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 배포 및 헬스체크
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:develop
          CONTAINER: ${{ env.CONTAINER_NAME }}
          PORT: ${{ env.APP_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER,PORT,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io

            # DB 접속 정보 같은 런타임 설정은 EC2의 이 파일에만 둔다.
            # Actions 시크릿으로 넘기면 워크플로 로그와 러너를 한 번씩 더 거친다.
            ENV_OPT=""
            if [ -f "$HOME/puzzlemeet.env" ]; then
              ENV_OPT="--env-file $HOME/puzzlemeet.env"
            fi

            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p "$PORT:8080" \
              $ENV_OPT \
              "$IMAGE"

            # 뜨는 데 실패하면 여기서 잡는다. 안 잡으면 컨테이너만 죽은 채로 워크플로가 초록불이 된다.
            for i in $(seq 1 30); do
              if curl -fsS "http://localhost:$PORT/health" > /dev/null 2>&1; then
                echo "헬스체크 통과 (${i}회째)"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "헬스체크 실패 - 최근 로그 100줄"
            docker logs --tail 100 "$CONTAINER"
            exit 1
