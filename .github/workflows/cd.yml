name: CD

on:
  push:
    branches: [ develop ]

# 배포는 취소하지 않고 순서대로 처리한다.
concurrency:
  group: cd-develop
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CONTAINER_NAME: puzzlemeet
  APP_PORT: 8080

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v6

      # build는 테스트와 spotlessCheck까지 실행한다.
      - name: 빌드 및 테스트
        run: ./gradlew clean build

      - name: Buildx 설치
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Dockerfile에 RUN이 없어 QEMU 없이 arm64 이미지를 만들 수 있다.
      # RUN을 추가하면 docker/setup-qemu-action이 함께 필요하다.
      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:develop
          # 이 라벨이 있어야 패키지가 레포에 연결되어 권한을 상속받는다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: EC2 배포 및 헬스체크
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:develop
          CONTAINER: ${{ env.CONTAINER_NAME }}
          PORT: ${{ env.APP_PORT }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER,PORT,REGISTRY_USER,REGISTRY_TOKEN
          script_stop: true
          script: |
            set -e

            # 런타임 설정은 EC2의 이 파일에서 읽는다. 없으면 컨테이너를 건드리기 전에 멈춘다.
            ENV_FILE="$HOME/puzzlemeet.env"
            if [ ! -f "$ENV_FILE" ]; then
              echo "환경변수 파일이 없습니다: $ENV_FILE"
              exit 1
            fi

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io

            # pull이 끝난 뒤에 기존 컨테이너를 내린다.
            docker rm -f "$CONTAINER" 2>/dev/null || true
            
            # 이 값이 Dockerfile의 MaxRAMPercentage=65가 계산하는 기준이 된다.
            # memory-swap을 같은 값으로 두면 스왑을 쓰지 않는다.
            # 컨테이너 로그는 10MB씩 3개까지만 보관한다.
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p "$PORT:8080" \
              --env-file "$ENV_FILE" \
              --memory 700m \
              --memory-swap 700m \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE"

            # 2초 간격으로 최대 120초 동안 확인하고, 통과하면 즉시 종료한다.
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$PORT/health" > /dev/null 2>&1; then
                echo "헬스체크 통과 (${i}회째)"
                # dangling 이미지만 정리한다. -a를 쓰면 이전 버전까지 지워져 수동 복구가 막힌다.
                docker image prune -f || true
                exit 0
              fi
              sleep 2
            done

            # 롤백하지 않는다. 로그를 남기고 워크플로를 실패시킨다.
            echo "헬스체크 실패 - 최근 로그 100줄"
            docker logs --tail 100 "$CONTAINER" || true
            exit 1
