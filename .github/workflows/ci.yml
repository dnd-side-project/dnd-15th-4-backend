name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

# 같은 브랜치에 연속 push하면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      # Gradle 캐시는 이 액션이 담당한다.
      # setup-java의 cache 옵션과 같이 쓰면 캐시가 이중으로 잡히므로 하나만 쓴다.
      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v6

      # build가 check -> spotlessCheck까지 실행하지만,
      # 포맷 위반과 테스트 실패를 Actions UI에서 구분하려고 먼저 돌린다.
      - name: Spotless 포맷 검사
        run: ./gradlew spotlessCheck

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 7
