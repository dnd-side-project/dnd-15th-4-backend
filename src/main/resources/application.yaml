spring:
  application:
    name: PuzzleMeet
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 30m
  refresh-token-expiry: 14d

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  authorize-uri: https://kauth.kakao.com/oauth/authorize
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  unlink:
    admin-key: ${KAKAO_ADMIN_KEY}
    uri: https://kapi.kakao.com/v1/user/unlink
  map:
    transit-route-uri: https://dapi.kakao.com/v2/routing/publictraffic

tmap:
  app-key: ${TMAP_APP_KEY}
  transit-route-uri: https://apis.openapi.sk.com/transit/routes
  car-route-uri: https://apis.openapi.sk.com/tmap/routes/prediction
  pedestrian-route-uri: https://apis.openapi.sk.com/tmap/routes/pedestrian
  poi-search-uri: https://apis.openapi.sk.com/tmap/pois
  poi-around-search-uri: https://apis.openapi.sk.com/tmap/pois/search/around

frontend:
  login-redirect-uri: ${FRONTEND_LOGIN_REDIRECT_URI}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  s3:
    bucket: puzzle-meet-s3
    puzzle-path: puzzles

webpush:
  vapid:
    public-key: ${WEBPUSH_VAPID_PUBLIC_KEY}
    private-key: ${WEBPUSH_VAPID_PRIVATE_KEY}
    subject: ${WEBPUSH_VAPID_SUBJECT}
  ttl-seconds: 600
